# cargo-about configuration: generates THIRD-PARTY-NOTICES.txt (see installer/build.ps1).
# Only these licenses are accepted; a dependency under any other license fails the build,
# so new license obligations can't slip in unnoticed. Order is preference: for crates
# offered under several licenses, the first match is used (MIT is the simplest to meet).
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# One notices file covers every platform we ship.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Vera View itself is not third-party software.
private = { ignore = true }
